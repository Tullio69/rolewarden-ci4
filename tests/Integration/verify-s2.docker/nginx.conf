# S2: nginx in front of Apache, terminating HTTPS with a self-signed certificate (generated at run time, never committed)
server {
    listen 443 ssl;
    server_name localhost;
    ssl_certificate     /etc/nginx/s2/cert.pem;
    ssl_certificate_key /etc/nginx/s2/key.pem;
    location / {
        proxy_pass http://s2-web:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
