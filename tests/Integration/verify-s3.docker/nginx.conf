# S3: nginx in front of Apache, terminating HTTPS with a self-signed certificate (generated at run time, never committed).
# The two proxy_set_header lines are those of documentation/installation.html#proxy (1.0.0): X-Forwarded-For REPLACED
# with the visitor's address ($remote_addr), X-Forwarded-Proto. Host is passed as a standard reverse proxy does.
server {
    listen 443 ssl;
    server_name localhost;
    ssl_certificate     /etc/nginx/s3/cert.pem;
    ssl_certificate_key /etc/nginx/s3/key.pem;
    location / {
        proxy_pass http://s3-web:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
