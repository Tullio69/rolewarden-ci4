<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Button</title>
<style> body{margin:0} .wrap{padding:20px 24px;display:flex;flex-direction:column;gap:16px} .row{display:flex;gap:8px;align-items:center} </style></head>
<body>
<div class="rw wrap">
  <div class="row">
    <button class="rw-btn rw-btn--primary" type="button">Save changes</button>
    <button class="rw-btn rw-btn--secondary" type="button">Invite user</button>
    <button class="rw-btn rw-btn--ghost" type="button">Discard</button>
    <button class="rw-btn rw-btn--danger" type="button">Delete role</button>
    <button class="rw-btn rw-btn--primary" type="button" disabled>Save changes</button>
  </div>
  <div class="row">
    <button class="rw-btn rw-btn--secondary rw-btn--sm" type="button">Export CSV</button>
    <button class="rw-btn rw-btn--ghost rw-btn--sm" type="button">Clear filters</button>
  </div>
</div>
</body></html>
