# Ambiente di sviluppo locale. Non fa parte del pacchetto distribuito.
# Avvio:   docker compose up -d
# Stop:    docker compose stop
# Reset:   docker compose down -v   (cancella i dati, ricrea i database da zero)

services:
  db:
    image: mariadb:11
    container_name: rolewarden-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rolewarden
      MARIADB_DATABASE: rolewarden
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-storage-engine=InnoDB
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12

  adminer:
    image: adminer:latest
    container_name: rolewarden-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy

  # Catches every email the test app sends: nothing leaves this machine. Read the messages at
  # http://localhost:${MAIL_UI_PORT:-8026} or through its API (/api/v1/messages).
  mail:
    image: axllent/mailpit:latest
    container_name: rolewarden-mail
    restart: unless-stopped
    ports:
      - "${MAIL_SMTP_PORT:-1026}:1025"
      - "${MAIL_UI_PORT:-8026}:8025"

volumes:
  db-data:
