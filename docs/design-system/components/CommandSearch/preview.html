<!-- @dsCard group="Overlays" height=560 width=960 subtitle="Ctrl K, typing an identifier" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Command search</title>
<style>
  html, body { margin: 0; background: var(--surface); }
  .stage { position: relative; width: 960px; height: 560px; overflow: hidden; font: 400 14px/20px var(--font-sans); color: var(--ink); font-variant-numeric: tabular-nums; }
  .ghost { position: absolute; inset: 0; display: flex; }
  .ghost .s { width: 200px; background: var(--side-surface); }
  .ghost .c { flex: 1; display: flex; flex-direction: column; gap: 18px; padding: 72px 40px; }
  .ghost i { display: block; background: var(--rule); }
  .scrim { position: absolute; inset: 0; background: rgba(23, 25, 28, 0.45); display: flex; justify-content: center; padding-top: 72px; box-sizing: border-box; }
  .pal { width: 600px; height: fit-content; background: var(--surface-raised); border-radius: 4px; box-shadow: var(--shadow-float); }
  .fld { display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 16px; border-bottom: 1px solid var(--rule-strong); }
  .fld input { flex: 1; height: 40px; border: 0; outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 2px; padding: 0 6px; font: 400 15px/20px var(--font-mono); color: var(--ink); background: var(--surface-raised); }
  kbd { font: 400 11px/14px var(--font-mono); padding: 1px 5px; border: 1px solid var(--rule-strong); border-radius: 2px; color: var(--ink-faint); }
  .lab { display: block; padding: 12px 16px 4px; font: 600 12px/16px var(--font-sans); letter-spacing: .04em; color: var(--ink-muted); }
  .lab + .lab, .sep { border-top: 1px solid var(--rule); margin-top: 4px; }
  .opt { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 6px 16px; box-sizing: border-box; color: var(--ink); text-decoration: none; }
  .opt[aria-selected="true"] { background: var(--accent-tint); }
  .opt .t { flex: 1; display: flex; flex-direction: column; }
  .opt small { font-size: 12px; line-height: 16px; color: var(--ink-muted); }
  code { font: 400 13px/20px var(--font-mono); }
  .foot { display: flex; gap: 16px; align-items: center; height: 40px; padding: 0 16px; border-top: 1px solid var(--rule); font-size: 12px; color: var(--ink-faint); background: var(--surface); }
  .vh { position: absolute; left: -9999px; }
</style>
</head>
<body>
<div class="stage">
  <div class="ghost" aria-hidden="true"><div class="s"></div><div class="c"><i style="width:220px;height:28px"></i><i style="height:1px"></i><i style="height:70px"></i><i style="height:180px"></i></div></div>
  <div class="scrim">
    <div class="pal" role="dialog" aria-label="Search or run a command">
      <label class="fld"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="var(--ink-muted)" stroke-width="1.5" stroke-linecap="square" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5l3 3"/></svg><span class="vh">Search</span><input type="text" role="combobox" aria-expanded="true" aria-controls="res" value="users.del"><kbd>Esc</kbd></label>
      <div id="res" role="listbox" aria-label="Results">
        <span class="lab">PERMISSION</span>
        <a class="opt" href="#" role="option" aria-selected="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="square" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5l3 3"/><path d="M5 7l1.5 1.5 2.5-2.5"/></svg><span class="t"><span><code>users.delete</code> <span style="color:var(--ink-muted)">· who can do this</span></span><small>8 users through 2 roles, 1 denied by override</small></span><kbd style="color:var(--accent);border-color:var(--accent)">Enter</kbd></a>
        <a class="opt" href="#" role="option" aria-selected="false"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="var(--ink-muted)" stroke-width="1.5" stroke-linecap="square" aria-hidden="true"><path d="M2.5 2.5h11v11h-11z"/><path d="M2.5 6.5h11M2.5 10h11M6.5 2.5v11"/></svg><span class="t">Open <code>users.delete</code> in the permission matrix</span></a>
        <span class="lab sep">GO TO</span>
        <a class="opt" href="#" role="option" aria-selected="false"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="var(--ink-muted)" stroke-width="1.5" stroke-linecap="square" aria-hidden="true"><circle cx="8" cy="5.5" r="2.5"/><path d="M3 13.5c.6-2.6 2.6-4 5-4s4.4 1.4 5 4"/></svg><span class="t">Users</span><span style="font-size:12px;color:var(--ink-faint)">248</span></a>
        <span class="lab sep">ACTIONS</span>
        <a class="opt" href="#" role="option" aria-selected="false"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="var(--ink-muted)" stroke-width="1.5" stroke-linecap="square" aria-hidden="true"><path d="M2.5 13.5l2-.5 8-8-1.5-1.5-8 8z"/></svg><span class="t">Add an override for a user</span></a>
      </div>
      <div class="foot"><span>Up and down to move</span><span>Enter to open</span><span>Results show only what you may do</span></div>
    </div>
  </div>
</div>
</body>
</html>
