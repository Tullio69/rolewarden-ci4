# S3 sensitivity only: the S2 forwarding (X-Forwarded-For APPENDED with $proxy_add_x_forwarded_for), not the 1.0.0 lines. nginx in front of Apache, terminating HTTPS with a self-signed certificate (generated at run time, never committed)
server {
    listen 443 ssl;
    server_name localhost;
    ssl_certificate     /etc/nginx/s3/cert.pem;
    ssl_certificate_key /etc/nginx/s3/key.pem;
    location / {
        proxy_pass http://s3-web:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
