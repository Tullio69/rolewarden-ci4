# R1 resumption (Collaudatore ad Hoc): sidecar r1-fwd for the regression on PHP 8.5 (verify-r1.v7lib.php).
# The PHP containers share this container's network namespace, so the 127.0.0.1:3317 (database) and 127.0.0.1:1026
# (Mailpit) written in the test applications' .env reach the host, as they do when the suites run on the host's PHP.
worker_processes 1;
events { worker_connections 256; }
stream {
    server { listen 127.0.0.1:3317; proxy_pass host.docker.internal:3317; }
    server { listen 127.0.0.1:1026; proxy_pass host.docker.internal:1026; }
}
